# Curated security-tool dictionary.
# Each entry: canonical_name -> {category, aliases[]}
# Aliases are matched case-insensitively as whole-word substrings against
# detection text. Keep aliases conservative — false positives erode the trust
# the whole confidence layer exists to protect.

